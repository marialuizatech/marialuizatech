name: Mikasa Contribution Battle

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar animação da Mikasa
        run: python scripts/generate_mikasa.py

      - name: Salvar animação no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/mikasa-contribution-graph.svg
          git commit -m "Atualiza animação da Mikasa" || echo "Sem alterações"
          git push
